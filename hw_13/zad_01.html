<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class=container>
    <form class="form" action="" method="get">
        <h1>We would like to help you</h1>
        <input class="textField" id="name" type="text" name="user_name" placeholder="Name" required>
        <span class="errorText"></span>
        <textarea class="textField" id="message" name="user_message" placeholder="Message"></textarea>
        <span class="errorText"></span>
        <span>How to answer you?</span>
        <input class="textField" id="phone" type="tel" name="user_tel" placeholder="Phone number" required>
        <span class="errorText"></span>
        <input class="textField" id="email" type="email" placeholder="Email" name="user_email">
        <span class="errorText"></span>
        <button class="send_btn" type="submit"><span>Send message</span></button>
    </form>
</div>
<script>
    const mainForm = document.querySelector('.form')
    const fName = document.querySelector('#name')
    const fEmail = document.querySelector('#email')
    const fMessage = document.querySelector('#message')
    const fPhone = document.querySelector('#phone')
    const error = document.querySelectorAll('.errorText')
    const checkName = () => {
        if(fName.value.trim().length <= 5) {
            error[0].textContent = 'min 5 characters long'
        }
        else {
            error[0].textContent = ''
        }
    }

    const checkEmail = () => {
        const regex = /@gmail.com/
        if (!regex.test(fEmail.value)) {
            error[3].textContent = 'invalid email'
        }
        else error[3].textContent = ''
    }

    const checkMessage = () => {
        if(fMessage.value.trim().length < 30) {
            error[1].textContent= 'min 30 in message'
        }
        else {
            error[1].textContent = ''
        }
    }

    const checkPhone = () => {
        const regex = /^\+380\d{9}$/
        if (!regex.test(fPhone.value)){
            error[2].textContent = 'invalid phone number'
        }
        else {
            error[2].textContent = ''
        }
    }
    const checkField = (e) => {
        if (e.target === fName) {
            checkName()
        }
        else if (e.target === fEmail) {
            checkEmail()
        }
        else if (e.target === fMessage) {
            checkMessage()
        }
        else {
            checkPhone()
        }
    }

    const checkFinal = (e) => {

        checkName()
        checkEmail()
        checkMessage()
        checkPhone()
        e.preventDefault()
        const formData = new FormData(mainForm)
        formData.append('user_num', '55')
        for (let [key, value] of formData) {
            console.log(key, value)
        }

    }


    mainForm.addEventListener('focusout', checkField)
    mainForm.addEventListener('submit', checkFinal)
</script>
</body>
</html>
