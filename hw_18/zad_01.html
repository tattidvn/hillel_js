<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title></title>
</head>
<body>
    <p>Таймер відліку</p>
    <span></span>
<script>
    let number = 567
    const span = document.querySelector('span')
    span.textContent = setTimeFormat(number)
    function setTimeFormat(mySeconds) {
        const minutes = Math.floor(mySeconds / 60).toString().padStart(2, '0');
        const seconds = Math.floor(mySeconds % 60).toString().padStart(2, '0');
        return `${minutes}:${seconds}`;
    }

    function timer() {
        const count = setInterval(() => {
            if(number > 0) {
                number--;
                span.textContent = setTimeFormat(number)
            }
            else{
                clearInterval(count)
            }
        }, 1000)
    }
    timer()
</script>
</body>
</html>
