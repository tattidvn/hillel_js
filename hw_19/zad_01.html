<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <title></title>
</head>
<body>
<div class="container">
    <div class="left_side">
        <p class="currentData"><span></span><span></span><span></span></p>
        <p class="weather"></p>
        <p class="currentTime"> <span></span> <span></span></p>
        <p class="weather"></p>
        <p class="weather"></p>
        <p class="weather"></p>
    </div>
    <div class="right_side">
        <img src="" alt="icon">
        <p class="degree"></p>
        <p class="weather"></p>
        <p class="weather"></p>
        <div>
            <span class="weather city"></span>
            <button>⟳</button>
        </div>
    </div>
</div>
<script>
    const currentData = document.querySelector('.currentData');
    const currentSunrise = document.querySelector('.left_side p:nth-child(2)');
    const humidity = document.querySelector('.left_side p:nth-child(4)');
    const pressure = document.querySelector('.left_side p:nth-child(5)');
    const wind = document.querySelector('.left_side p:nth-child(6)');
    const btnRefresh = document.querySelector('button');
    const hour = document.querySelector('.currentTime span:nth-child(1)');
    const dayPeriod = document.querySelector('.currentTime span:nth-child(2)');
    const temperature = document.querySelector('.degree')
    const feelsLike = document.querySelector('.right_side p:nth-child(3)');
    const description = document.querySelector('.right_side p:nth-child(4)');
    const city = document.querySelector('.city');
    const weatherImg = document.querySelector('img');
    btnRefresh.addEventListener('click', renderWeather)
    document.addEventListener('DOMContentLoaded', renderWeather);
    async function getCurrentWeather() {
        const response = await fetch('https://api.openweathermap.org/data/2.5/weather?q=London&appid=6dac1d15c6de17000061441181c52d6a&units=metric')
        return await response.json()
    }

    function renderWeather(){
        getCurrentWeather().then((result) => {
            try {
                const weater = result
                const time = new Date(weater.dt * 1000)
                const sunrise = new Date((weater.sys.sunrise * 1000))
                const currMonthYear = new Date((weater.dt * 1000))
                const timeOptions = {hour: 'numeric', minute: '2-digit', hour12: true}
                const dateOptions = { day: 'numeric', year: 'numeric',  weekday: 'short', month: 'short',};
                const [digit, period] = time.toLocaleTimeString('en-US', timeOptions).split(' ')
                temperature.textContent = String(Math.trunc(weater.main.temp)) + '°C'
                city.textContent = weater.name
                feelsLike.textContent = 'Feels like: ' + Math.floor(weater.main.feels_like) + '°C'
                description.textContent = weater.weather[0].description
                humidity.textContent = 'Humidity: ' + (Math.floor(weater.main.humidity)) + '%'
                pressure.textContent = 'Pressure: ' + weater.main.pressure + ' hPa'
                wind.textContent = 'Wind: ' + weater.wind.speed + ' km/h SSE'
                hour.textContent = digit
                dayPeriod.textContent = period
                currentSunrise.textContent = 'SUN ' + sunrise.toLocaleTimeString('en-US', timeOptions)
                currentData.textContent = currMonthYear.toLocaleDateString('en-US', dateOptions).replaceAll(',', ' ')
                const imgIcon = weater.weather[0].icon
                const urlIcon  = `https://openweathermap.org/img/wn/${imgIcon}@2x.png`;
                weatherImg.src = urlIcon
            }catch (error){
                console.error('Error:', error)
            }
        })
    }

</script>
</body>
</html>
