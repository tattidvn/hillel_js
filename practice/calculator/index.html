<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title></title>
</head>
<body>
<div class="calc">
    <table>
        <tbody>
            <tr class="textField"><td colspan="4"> <span></span></td></tr>
            <tr>
                <td><button class="digit">7</button></td>
                <td><button class="digit">8</button></td>
                <td><button class="digit">9</button></td>
                <td><button class="extion">/</button></td>
            </tr>
            <tr>
                <td><button class="digit">4</button></td>
                <td><button class="digit">5</button></td>
                <td><button class="digit">6</button></td>
                <td><button class="extion">*</button></td>
            </tr>
            <tr>
                <td><button class="digit">1</button></td>
                <td><button class="digit">2</button></td>
                <td><button class="digit">3</button></td>
                <td><button class="extion">-</button></td>
            </tr>
            <tr>
                <td><button>.</button></td>
                <td><button class="digit">0</button></td>
                <td><button class="extion">%</button></td>
                <td><button class="extion">+</button></td>
            </tr>
            <tr>
                <td colspan="2"><button class="botom_button">del</button></td>
                <td><button>=</button></td>
                <td><button><</button></td>
            </tr>
        </tbody>
    </table>
</div>
</body>

<script>
    const calculate = document.querySelector('table')
    const textField = document.querySelector('span');
    let prevnum = ''
    let nextnum = ''
    let selectedExtion = null

    const find = (e) => {
        if(e.target.tagName === 'BUTTON'){
            const digit = e.target.classList.contains('digit')
            const extion = e.target.classList.contains('extion')
            const deleted = e.target.textContent === 'del'
            const comma = e.target.textContent === '.'
            const equals = e.target.textContent === '='
            const text = e.target.textContent
            const popDigit = e.target.textContent === '<'
            let currNum = ''
            if(digit || comma){
                let currentNum = !selectedExtion ? prevnum : nextnum
                if (comma && currentNum.includes('.'))return;
                if (!selectedExtion) {
                    prevnum += text;
                } else {
                    nextnum += text;
                }
                textField.textContent += text;
            }
            if(popDigit){
                if(!selectedExtion){
                    prevnum = prevnum.slice(0, -1)
                    textField.textContent = prevnum
                }
                else{
                    nextnum = nextnum.slice(0, -1)
                    textField.textContent = nextnum
                }

            }
            else if (extion){
                textField.textContent += ' ' + text + ' '
                selectedExtion = text
            }
            else if (deleted){
                textField.textContent = ''
                prevnum = ''
                nextnum = ''
                selectedExtion = null
            }
            else if (equals){
                let res = 0
                const num1 = Number(prevnum)
                const num2 = Number(nextnum)
                if (selectedExtion === '+'){
                    res = num1 + num2
                }
                else if (selectedExtion === '-'){
                    res = num1 - num2
                }
                else if (selectedExtion === '*'){
                    res = num1 * num2
                }
                else if (selectedExtion === '/'){
                    let num = (num1 / num2)
                    res = Math.round(num * 100) / 100
                }
                else if (selectedExtion === '%'){
                    res = num1 % num2
                }
                textField.textContent = String(res)
                nextnum = ''
                prevnum = String(res)
                selectedExtion = null
            }
        }

    }
    calculate.addEventListener('click', find)
</script>
</html>
