<body>
<div class="MyDiv">
    <p>Tasks</p>
    <ul></ul>
    <input placeholder="Add new task">
    <button>Add</button>
</div>
<script>
    const myDiv = document.querySelector('.MyDiv');
    const newtask = document.querySelector('input')
    const btnAdd = document.querySelector('button')
    const tasksList = document.querySelector('ul')
    const wtext = document.createElement('p')
    wtext.textContent = 'write the task first!'
    wtext.classList.add("visible")
    myDiv.appendChild(wtext)

    const createTask = () => {
        const task = document.createElement('li')
        const btnDelTask = document.createElement('button')
        btnDelTask.textContent = 'Del'
        task.textContent = newtask.value
        tasksList.append(task)
        task.append(btnDelTask)
    }

    const addNewTask = (callback) => {
        if (newtask.value.trim() !== ''){
            callback()
            wtext.classList.add("visible")
        }
        else{
            wtext.classList.remove("visible")
        }
    }

    const delTask = (e) => {
        if (e.target.textContent === 'Del') {
            e.target.parentElement.remove()
        }
    }

    btnAdd.addEventListener('click', () => addNewTask(createTask))
    tasksList.addEventListener('click', delTask)

    const myForm = document.querySelector('form')
    const errorMass = document.querySelectorAll('.errorText')
    const formAction = (event) => {
        if (event.target.id === 'name') {
            event.target.value === ''? errorMass[0].textContent = 'Enter your name': errorMass[0].textContent = ''
        }
        else if (event.target.id === 'message') {
            /[a-zA-Z]{5,}/.test(event.target.value)? errorMass[1].textContent = '': errorMass[1].textContent = 'Min 5'
        }
        else if (event.target.id === 'phone'){
            /^\+380/.test(event.target.value)? errorMass[2].textContent = '': errorMass[2].textContent = 'Start with +380'
        }
        else if (event.target.id === 'email'){
            if(!/@/.test(event.target.value)){
                errorMass[3].textContent = 'Must contain @'
            }
            else if (!/\./.test(event.target.value)){
                errorMass[3].textContent = 'Must contain .'
            }
            else {
                errorMass[3].textContent = ''
            }
        }
    }

    const submitForm = (event) => {
        event.preventDefault()
        const data = new FormData(event.target)
        for (let pair of data){
            console.log(pair)
        }
    }
    myForm.addEventListener('input', formAction)
    myForm.addEventListener('submit', submitForm)
